name: Build Windows exe

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build SmtcBridge
        run: >
          dotnet publish smtc/bridge-src/SmtcBridge.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true
          -o smtc/bridge

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build portable exe
        run: npx electron-builder --win portable --x64 --publish never

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Liquid-Glass-Music-portable
          path: release/Liquid Glass Music.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/Liquid Glass Music.exe
